site_name: PySpark Learning Notes
site_description: PySpark and Databricks concepts, patterns, and case study notes from the bootcamp
site_author: Saidev Bhaskar

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
    - Layer 1 — Before you load anything:
      - How Spark Works: concepts/spark-architecture.md
      - Schema Definition: concepts/schema-definition.md
    - Layer 2 — Getting data in:
      - Data Ingestion: concepts/data-ingestion.md
      - Unity Catalog: concepts/unity-catalog.md
    - Layer 3 — Basic transformations:
      - Select & Drop: concepts/select.md
      - Column Operations: concepts/column-operations.md
      - Wildcards: concepts/wildcards.md
    - Layer 4 — Cleaning & validation:
      - Regex: concepts/regex.md
      - Data Quality & Quarantine: concepts/data-quality.md
      - Business Logic: concepts/business-logic.md
    - Layer 5 — Security & compliance:
      - PII Handling: concepts/pii-handling.md
      - Data Masking: concepts/data-masking.md
      - Hashing & Salting: concepts/hashing.md
    - Layer 6 — Advanced operations:
      - Joins in PySpark: concepts/joins.md
      - Pivot: concepts/pivot.md
      - Window Functions: concepts/window-functions.md
  - Case Studies:
    - Case Study 1 — Green Grid: case-studies/green-grid.md
    - Case Study 2 — SantéFlux: case-studies/santeflux.md
